<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960">
  <!-- Background wall -->
  <rect width="540" height="960" fill="#f5ede8"/>
  
  <!-- Wall gradient for depth -->
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4ef"/>
      <stop offset="100%" stop-color="#e8d5c8"/>
    </linearGradient>
    <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4b8"/>
      <stop offset="100%" stop-color="#b8a898"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c9a0"/>
      <stop offset="100%" stop-color="#e8a878"/>
    </linearGradient>
    <linearGradient id="jarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e0dc"/>
    </linearGradient>
    <linearGradient id="jarLidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ddd5"/>
      <stop offset="100%" stop-color="#9abfb3"/>
    </linearGradient>
    <linearGradient id="mirrorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddeef8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b8d4e8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0a05"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e0d8"/>
      <stop offset="100%" stop-color="#a0c4b8"/>
    </linearGradient>
    <radialGradient id="faceLight" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fde0c0"/>
      <stop offset="100%" stop-color="#e8a878"/>
    </radialGradient>
    <radialGradient id="moistureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00000022"/>
      <stop offset="100%" stop-color="#00000000"/>
    </linearGradient>
  </defs>

  <!-- Background wall -->
  <rect width="540" height="960" fill="url(#wallGrad)"/>

  <!-- Subtle wall panels / trim lines -->
  <rect x="0" y="0" width="540" height="580" fill="none" stroke="#e0cec5" stroke-width="1"/>
  <line x1="0" y1="520" x2="540" y2="520" stroke="#d4c0b5" stroke-width="2"/>

  <!-- Counter / shelf -->
  <rect x="0" y="540" width="540" height="420" fill="url(#counterGrad)"/>
  <rect x="0" y="540" width="540" height="14" fill="#c0afa0"/>
  <!-- Counter surface highlight -->
  <rect x="0" y="540" width="540" height="4" fill="#ddd0c5"/>

  <!-- Mirror on wall -->
  <rect x="160" y="40" width="220" height="290" rx="10" fill="url(#mirrorGrad)" stroke="#d0c0b5" stroke-width="5"/>
  <!-- Mirror frame -->
  <rect x="158" y="38" width="224" height="294" rx="12" fill="none" stroke="#c8b8a8" stroke-width="6"/>
  <!-- Mirror reflection highlight -->
  <rect x="170" y="50" width="40" height="120" rx="5" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Mirror reflection - hint of face in mirror -->
  <ellipse cx="270" cy="185" rx="52" ry="60" fill="#f5c9a0" fill-opacity="0.6"/>
  <ellipse cx="270" cy="150" rx="55" ry="45" fill="#3a2010" fill-opacity="0.5"/>

  <!-- Person body / shirt -->
  <path d="M110 560 Q120 480 175 450 Q220 430 270 428 Q320 430 365 450 Q420 480 430 560 L430 680 L110 680 Z" fill="url(#shirtGrad)"/>
  <!-- Shirt collar -->
  <path d="M230 428 Q270 445 310 428" fill="none" stroke="#8ab8ac" stroke-width="3"/>

  <!-- Neck -->
  <rect x="245" y="395" width="50" height="50" rx="15" fill="url(#faceLight)"/>

  <!-- Face -->
  <ellipse cx="270" cy="330" rx="90" ry="100" fill="url(#faceLight)"/>
  
  <!-- Face shadow/depth -->
  <ellipse cx="290" cy="345" rx="70" ry="80" fill="#e89060" fill-opacity="0.15"/>

  <!-- Hair - top -->
  <ellipse cx="270" cy="240" rx="95" ry="70" fill="url(#hairGrad)"/>
  <!-- Hair sides -->
  <path d="M180 270 Q175 340 190 390 Q205 380 215 360 Q200 310 200 270 Z" fill="#3a2010"/>
  <path d="M360 270 Q365 340 350 390 Q335 380 325 360 Q340 310 340 270 Z" fill="#3a2010"/>
  <!-- Hair top strands -->
  <path d="M185 265 Q200 235 270 225 Q340 235 355 265" fill="none" stroke="#5a3020" stroke-width="3"/>

  <!-- Ears -->
  <ellipse cx="182" cy="335" rx="14" ry="18" fill="#e8a878"/>
  <ellipse cx="358" cy="335" rx="14" ry="18" fill="#e8a878"/>

  <!-- Eyebrows -->
  <path d="M220 290 Q240 282 258 286" fill="none" stroke="#3a2010" stroke-width="4" stroke-linecap="round"/>
  <path d="M282 286 Q300 282 320 290" fill="none" stroke="#3a2010" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes -->
  <!-- Left eye -->
  <ellipse cx="240" cy="310" rx="20" ry="13" fill="#fff"/>
  <ellipse cx="242" cy="311" rx="12" ry="11" fill="#6b3a1f"/>
  <ellipse cx="244" cy="311" rx="7" ry="7" fill="#1a0a05"/>
  <ellipse cx="248" cy="307" rx="3" ry="3" fill="#ffffff"/>
  <!-- Left eyelashes -->
  <path d="M222 305 Q230 296 240 298" fill="none" stroke="#1a0a05" stroke-width="2"/>
  <path d="M258 305 Q252 296 242 298" fill="none" stroke="#1a0a05" stroke-width="2"/>

  <!-- Right eye -->
  <ellipse cx="300" cy="310" rx="20" ry="13" fill="#fff"/>
  <ellipse cx="298" cy="311" rx="12" ry="11" fill="#6b3a1f"/>
  <ellipse cx="298" cy="311" rx="7" ry="7" fill="#1a0a05"/>
  <ellipse cx="302" cy="307" rx="3" ry="3" fill="#ffffff"/>
  <!-- Right eyelashes -->
  <path d="M282 305 Q290 296 300 298" fill="none" stroke="#1a0a05" stroke-width="2"/>
  <path d="M318 305 Q310 296 300 298" fill="none" stroke="#1a0a05" stroke-width="2"/>

  <!-- Nose -->
  <path d="M265 320 Q260 348 252 355 Q262 360 270 358 Q278 360 288 355 Q280 348 275 320" fill="none" stroke="#c87848" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="256" cy="354" rx="7" ry="4" fill="#c87848" fill-opacity="0.4"/>
  <ellipse cx="284" cy="354" rx="7" ry="4" fill="#c87848" fill-opacity="0.4"/>

  <!-- Lips -->
  <path d="M248 375 Q258 368 270 370 Q282 368 292 375" fill="none" stroke="#d4806a" stroke-width="3" stroke-linecap="round"/>
  <path d="M248 375 Q258 385 270 387 Q282 385 292 375" fill="#d4806a" fill-opacity="0.7"/>
  <!-- Lip highlight -->
  <path d="M258 380 Q270 384 282 380" fill="none" stroke="#e8a090" stroke-width="1.5"/>

  <!-- Cheek blush - moisturizer glow -->
  <ellipse cx="213" cy="345" rx="30" ry="22" fill="#f08070" fill-opacity="0.20"/>
  <ellipse cx="327" cy="345" rx="30" ry="22" fill="#f08070" fill-opacity="0.20"/>
  <!-- Moisture sheen on cheeks -->
  <ellipse cx="213" cy="340" rx="22" ry="16" fill="url(#moistureGlow)"/>
  <ellipse cx="327" cy="340" rx="22" ry="16" fill="url(#moistureGlow)"/>

  <!-- LEFT ARM / HAND patting left cheek -->
  <!-- Left arm -->
  <path d="M175 450 Q155 490 140 530 Q128 555 120 575" fill="none" stroke="#e8a878" stroke-width="28" stroke-linecap="round"/>
  <!-- Left hand -->
  <ellipse cx="118" cy="585" rx="28" ry="22" fill="#f5c9a0"/>
  <!-- Fingers touching cheek -->
  <!-- Hand going to cheek - position fingers near left cheek -->
  <path d="M120 575 Q150 520 185 400" fill="none" stroke="#e8a878" stroke-width="26" stroke-linecap="round"/>
  <!-- Hand shape near left cheek -->
  <ellipse cx="195" cy="348" rx="26" ry="20" fill="#f0bc92"/>
  <!-- Fingers -->
  <path d="M182 335 Q180 320 183 308" fill="none" stroke="#f0bc92" stroke-width="10" stroke-linecap="round"/>
  <path d="M198 330 Q197 314 200 302" fill="none" stroke="#f0bc92" stroke-width="10" stroke-linecap="round"/>
  <path d="M212 335 Q213 319 215 308" fill="none" stroke="#f0bc92" stroke-width="9" stroke-linecap="round"/>
  <path d="M224 342 Q227 327 228 318" fill="none" stroke="#f0bc92" stroke-width="8" stroke-linecap="round"/>
  <!-- Thumb -->
  <path d="M180 348 Q168 350 162 358" fill="none" stroke="#f0bc92" stroke-width="10" stroke-linecap="round"/>

  <!-- RIGHT ARM - resting / relaxed -->
  <path d="M365 450 Q385 490 400 540 Q410 565 415 590" fill="none" stroke="#e8a878" stroke-width="28" stroke-linecap="round"/>
  <!-- Right hand resting -->
  <ellipse cx="415" cy="598" rx="28" ry="20" fill="#f5c9a0"/>
  <path d="M410 590 Q418 578 428 574" fill="none" stroke="#f5c9a0" stroke-width="9" stroke-linecap="round"/>
  <path d="M420 594 Q430 584 440 582" fill="none" stroke="#f5c9a0" stroke-width="9" stroke-linecap="round"/>
  <path d="M425 602 Q435 595 443 595" fill="none" stroke="#f5c9a0" stroke-width="8" stroke-linecap="round"/>
  <path d="M420 610 Q428 606 434 608" fill="none" stroke="#f5c9a0" stroke-width="7" stroke-linecap="round"/>
  <path d="M404 600 Q396 604 392 612" fill="none" stroke="#f5c9a0" stroke-width="9" stroke-linecap="round"/>

  <!-- PRODUCT JAR on counter -->
  <!-- Jar shadow -->
  <ellipse cx="390" cy="568" rx="52" ry="10" fill="#00000033"/>
  <!-- Jar body -->
  <rect x="345" y="490" width="95" height="75" rx="12" fill="url(#jarGrad)" stroke="#d8ccc5" stroke-width="2"/>
  <!-- Jar lid -->
  <rect x="340" y="475" width="105" height="24" rx="10" fill="url(#jarLidGrad)" stroke="#88b0a8" stroke-width="1.5"/>
  <!-- Jar lid highlight -->
  <rect x="348" y="478" width="45" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
  <!-- Jar label -->
  <rect x="350" y="505" width="85" height="48" rx="6" fill="#f8f4f0" stroke="#d4c8c0" stroke-width="1"/>
  <!-- Brand name on jar -->
  <text x="392" y="526" font-family="Arial" font-size="7.5" font-weight="bold" fill="#5a8a80" text-anchor="middle">Solara Skincare</text>
  <!-- Decorative line on label -->
  <line x1="358" y1="531" x2="428" y2="531" stroke="#c8d8d4" stroke-width="1"/>
  <text x="392" y="543" font-family="Arial" font-size="6" fill="#9aada8" text-anchor="middle">Moisturizer</text>
  <!-- Jar shine -->
  <rect x="352" y="498" width="18" height="50" rx="5" fill="#ffffff" fill-opacity="0.3"/>

  <!-- Small product on counter (extra detail) -->
  <!-- Pump bottle to the side -->
  <rect x="95" y="498" width="35" height="60" rx="8" fill="#e8d8d0" stroke="#c8b8b0" stroke-width="1.5"/>
  <rect x="108" y="478" width="9" height="22" rx="4" fill="#c8b0a8"/>
  <rect x="100" y="478" width="25" height="6" rx="3" fill="#b8a098"/>

  <!-- Counter items: small towel -->
  <rect x="60" y="542" width="55" height="22" rx="5" fill="#e8f0ec"/>
  <path d="M62 548 L112 548" stroke="#c8ddd5" stroke-width="2"/>
  <path d="M62 554 L112 554" stroke="#c8ddd5" stroke-width="2"/>

  <!-- Lighting effect from above -->
  <rect x="0" y="0" width="540" height="200" fill="url(#shadowGrad)" fill-opacity="0.08"/>
  
  <!-- Ambient light glow from top -->
  <ellipse cx="270" cy="0" rx="200" ry="80" fill="#fff8f0" fill-opacity="0.3"/>

</svg>